name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
      BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '.rubocop.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint Ruby
        run: bundle exec rubocop --format github

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_mcp_test
      BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recording_studio_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          cache-version: ${{ hashFiles('test/dummy/Gemfile.lock') }}

      - name: Install dummy app dependencies
        run: bundle install
        working-directory: test/dummy
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}

      - name: Build dummy app Tailwind assets
        run: bundle exec rails tailwindcss:build
        working-directory: test/dummy

      - name: Run tests
        run: bundle exec rake test:all
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/recording_studio_mcp_test

  # Oauth 0.13.1 still requires recording_studio_api < 0.15, so the app
  # lockfile stays on tag v0.14.1. This job loads API PR #61 sources
  # (cursor/oauth-authorized-by-metadata-9fc7) without bundling that branch.
  api-016:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout Recording Studio API 0.16
        uses: actions/checkout@v5
        with:
          repository: bowerbird-app/RecordingStudio_api
          ref: f83e4f9bea39477679834ca6eafabce3c1b7c2de
          path: tmp/recording_studio_api
          token: ${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install ActiveSupport
        run: gem install activesupport -v 8.1.4 --no-document

      - name: Exercise AccessGrant authorized_by
        run: ruby .github/api-0.16/probe.rb
        env:
          RECORDING_STUDIO_API_ROOT: tmp/recording_studio_api
