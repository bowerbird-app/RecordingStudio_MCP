AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'gemfiles/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_mcp/connection.rb'
    - 'lib/recording_studio_mcp/event_rpc.rb'
    - 'app/controllers/recording_studio_mcp/mcp_controller.rb'

Metrics/ModuleLength:
  Exclude:
    - 'lib/recording_studio_mcp/tools.rb'
    - 'lib/recording_studio_mcp/events.rb'
    - 'lib/recording_studio_mcp/event_rpc.rb'
    - 'lib/recording_studio_mcp/webhook_dispatch.rb'
    - 'lib/recording_studio_mcp/postgres_bus.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'db/migrate/**/*'
    - 'lib/recording_studio_mcp/tools.rb'
    - 'lib/recording_studio_mcp/event_rpc.rb'
    - 'lib/recording_studio_mcp/callback_http.rb'
    - 'lib/recording_studio_mcp/callback_url.rb'
    - 'lib/recording_studio_mcp/callback_verifier.rb'
    - 'lib/recording_studio_mcp/configuration.rb'
    - 'lib/recording_studio_mcp/webhook_delivery.rb'
    - 'lib/recording_studio_mcp/webhook_dispatch.rb'
    - 'lib/recording_studio_mcp/json_object_schema.rb'
    - 'lib/recording_studio_mcp/events.rb'
    - 'lib/recording_studio_mcp/postgres_bus.rb'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'db/migrate/**/*'
    - 'app/controllers/recording_studio_mcp/mcp_controller.rb'
    - 'lib/recording_studio_mcp/event_rpc.rb'
    - 'lib/recording_studio_mcp/callback_http.rb'
    - 'lib/recording_studio_mcp/callback_url.rb'
    - 'lib/recording_studio_mcp/webhook_dispatch.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_mcp/event_rpc.rb'
    - 'lib/recording_studio_mcp/callback_url.rb'
    - 'lib/recording_studio_mcp/json_object_schema.rb'
    - 'lib/recording_studio_mcp/webhook_dispatch.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_mcp/event_rpc.rb'
    - 'lib/recording_studio_mcp/webhook_dispatch.rb'

Metrics/ParameterLists:
  Exclude:
    - 'lib/recording_studio_mcp/event_rpc.rb'

Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

Lint/MissingSuper:
  Exclude:
    - 'test/services/**/*'
