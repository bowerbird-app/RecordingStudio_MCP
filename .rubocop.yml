AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'

# Relax metrics for test files and generators
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_mcp/catalog.rb'
    - 'lib/recording_studio_mcp/dispatcher.rb'
    - 'lib/recording_studio_mcp/protocol.rb'
    - 'lib/recording_studio_mcp/connection.rb'
    - 'lib/recording_studio_mcp/event_rpc.rb'
    - 'app/controllers/recording_studio_mcp/mcp_controller.rb'

Metrics/ModuleLength:
  Exclude:
    - 'lib/recording_studio_mcp/tools.rb'
    - 'lib/recording_studio_mcp/events.rb'
    - 'lib/recording_studio_mcp/event_rpc.rb'
    - 'lib/recording_studio_mcp/webhook_dispatch.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'db/migrate/**/*'
    - 'lib/recording_studio_mcp/dispatcher.rb'
    - 'lib/recording_studio_mcp/protocol.rb'
    - 'lib/recording_studio_mcp/tools.rb'
    - 'lib/recording_studio_mcp/event_rpc.rb'
    - 'lib/recording_studio_mcp/callback_http.rb'
    - 'lib/recording_studio_mcp/callback_url.rb'
    - 'lib/recording_studio_mcp/callback_verifier.rb'
    - 'lib/recording_studio_mcp/configuration.rb'
    - 'lib/recording_studio_mcp/webhook_delivery.rb'
    - 'lib/recording_studio_mcp/webhook_dispatch.rb'
    - 'lib/recording_studio_mcp/json_object_schema.rb'
    - 'lib/recording_studio_mcp/events.rb'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'db/migrate/**/*'
    - 'lib/recording_studio_mcp/dispatcher.rb'
    - 'lib/recording_studio_mcp/protocol.rb'
    - 'app/controllers/recording_studio_mcp/mcp_controller.rb'
    - 'lib/recording_studio_mcp/event_rpc.rb'
    - 'lib/recording_studio_mcp/callback_http.rb'
    - 'lib/recording_studio_mcp/callback_url.rb'
    - 'lib/recording_studio_mcp/webhook_dispatch.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/recording_studio_mcp/protocol.rb'
    - 'lib/recording_studio_mcp/event_rpc.rb'
    - 'lib/recording_studio_mcp/callback_url.rb'
    - 'lib/recording_studio_mcp/json_object_schema.rb'
    - 'lib/recording_studio_mcp/webhook_dispatch.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/recording_studio_mcp/event_rpc.rb'
    - 'lib/recording_studio_mcp/webhook_dispatch.rb'

Metrics/ParameterLists:
  Exclude:
    - 'lib/recording_studio_mcp/event_rpc.rb'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'test/services/**/*'
